spring:
  application:
    name: accounting-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/accounting_db
    username: ${DB_USER:gourmetgo}
    password: ${DB_PASS:secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  datasource:
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 60000

server:
  port: ${SERVER_PORT:8082}

grpc:
  server:
    port: ${GRPC_PORT:50053}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
