global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['order-service:8080']

  - job_name: kitchen-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['kitchen-service:8081']

  - job_name: accounting-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['accounting-service:8082']

  - job_name: order-orchestrator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['order-orchestrator:8083']
