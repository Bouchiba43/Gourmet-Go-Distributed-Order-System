networks:
  gourmetgo-net:
    driver: bridge

x-pg-healthcheck: &pg-healthcheck
  test: ["CMD-SHELL", "pg_isready -U gourmetgo -d postgres"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

x-spring-healthcheck: &spring-healthcheck
  interval: 15s
  timeout: 5s
  retries: 6
  start_period: 45s

services:

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       order_db
      POSTGRES_USER:     gourmetgo
      POSTGRES_PASSWORD: secret
    volumes:
      - order-db-data:/var/lib/postgresql/data
    networks: [gourmetgo-net]
    healthcheck: *pg-healthcheck
    restart: unless-stopped

  kitchen-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       kitchen_db
      POSTGRES_USER:     gourmetgo
      POSTGRES_PASSWORD: secret
    volumes:
      - kitchen-db-data:/var/lib/postgresql/data
    networks: [gourmetgo-net]
    healthcheck: *pg-healthcheck
    restart: unless-stopped

  accounting-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       accounting_db
      POSTGRES_USER:     gourmetgo
      POSTGRES_PASSWORD: secret
    volumes:
      - accounting-db-data:/var/lib/postgresql/data
    networks: [gourmetgo-net]
    healthcheck: *pg-healthcheck
    restart: unless-stopped

  order-service:
    image: bouchibaahmed/gourmetgo-order-service:20260519172434-16cc089
    environment:
      DB_HOST:     order-db
      DB_USER:     gourmetgo
      DB_PASS:     secret
      SERVER_PORT: 8080
      GRPC_PORT:   50051
    ports:
      - "8080:8080"
      - "50051:50051"
    depends_on:
      order-db:
        condition: service_healthy
    networks: [gourmetgo-net]
    restart: unless-stopped
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]

  kitchen-service:
    image: bouchibaahmed/gourmetgo-kitchen-service:20260519172434-16cc089
    environment:
      DB_HOST:     kitchen-db
      DB_USER:     gourmetgo
      DB_PASS:     secret
      SERVER_PORT: 8081
      GRPC_PORT:   50052
    ports:
      - "8081:8081"
      - "50052:50052"
    depends_on:
      kitchen-db:
        condition: service_healthy
    networks: [gourmetgo-net]
    restart: unless-stopped
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP || exit 1"]

  accounting-service:
    image: bouchibaahmed/gourmetgo-accounting-service:20260519172434-16cc089
    environment:
      DB_HOST:     accounting-db
      DB_USER:     gourmetgo
      DB_PASS:     secret
      SERVER_PORT: 8082
      GRPC_PORT:   50053
    ports:
      - "8082:8082"
      - "50053:50053"
    depends_on:
      accounting-db:
        condition: service_healthy
    networks: [gourmetgo-net]
    restart: unless-stopped
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP || exit 1"]

  order-orchestrator:
    image: bouchibaahmed/gourmetgo-order-orchestrator:20260519172434-16cc089
    environment:
      SERVER_PORT:             8083
      ORDER_SERVICE_HOST:      order-service
      KITCHEN_SERVICE_HOST:    kitchen-service
      ACCOUNTING_SERVICE_HOST: accounting-service
    ports:
      - "8083:8083"
    depends_on:
      order-service:
        condition: service_healthy
      kitchen-service:
        condition: service_healthy
      accounting-service:
        condition: service_healthy
    networks: [gourmetgo-net]
    restart: unless-stopped
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP || exit 1"]

  frontend:
    image: bouchibaahmed/gourmetgo-frontend:20260519172434-16cc089
    ports:
      - "3000:3000"
    depends_on:
      order-orchestrator:
        condition: service_healthy
    networks: [gourmetgo-net]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [gourmetgo-net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks: [gourmetgo-net]
    restart: unless-stopped

volumes:
  order-db-data:
  kitchen-db-data:
  accounting-db-data:
  prometheus-data:
  grafana-data:
