name: CI / CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  build-java:
    name: Build & Test Java
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gourmetgo
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: order_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gourmetgo -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build, test and package all modules
        run: mvn -B verify --no-transfer-progress
        env:
          DB_HOST: localhost
          DB_USER: gourmetgo
          DB_PASS: secret

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.xml'
          retention-days: 14

      - name: Upload service JARs
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          retention-days: 14
          path: |
            order-service/target/*.jar
            kitchen-service/target/*.jar
            accounting-service/target/*.jar
            order-orchestrator/target/*.jar

  build-frontend:
    name: Build & Lint Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm ${{ env.PNPM_VERSION }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build (Next.js standalone)
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8083
          NEXT_TELEMETRY_DISABLED: 1

  generate-tag:
    name: Generate Image Tag
    runs-on: ubuntu-latest
    needs: [build-java, build-frontend]
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    outputs:
      image-tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Generate image tag
        id: tag
        run: |
          TS=$(date -u +%Y%m%d%H%M%S)
          SHA="${GITHUB_SHA::7}"
          TAG="${TS}-${SHA}"
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"
          echo "::notice::Image tag → ${TAG}"

  docker-push:
    name: Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: generate-tag

    strategy:
      fail-fast: false
      matrix:
        include:
          - service:    order-service
            context:    .
            dockerfile: order-service/Dockerfile
            build-args: ""

          - service:    kitchen-service
            context:    .
            dockerfile: kitchen-service/Dockerfile
            build-args: ""

          - service:    accounting-service
            context:    .
            dockerfile: accounting-service/Dockerfile
            build-args: ""

          - service:    order-orchestrator
            context:    .
            dockerfile: order-orchestrator/Dockerfile
            build-args: ""

          - service:    frontend
            context:    ./frontend
            dockerfile: frontend/Dockerfile
            build-args: "NEXT_PUBLIC_API_URL=http://localhost:8083"

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context:    ${{ matrix.context }}
          file:       ${{ matrix.dockerfile }}
          push:       true
          build-args: ${{ matrix.build-args }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gourmetgo-${{ matrix.service }}:${{ needs.generate-tag.outputs.image-tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/gourmetgo-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,scope=${{ matrix.service }},mode=max

  update-compose:
    name: Pin Images in docker-compose.prod.yml
    runs-on: ubuntu-latest
    needs: [generate-tag, docker-push]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Substitute image tags
        env:
          TAG:  ${{ needs.generate-tag.outputs.image-tag }}
          USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for svc in order-service kitchen-service accounting-service order-orchestrator frontend; do
            sed -i \
              "s|image: .*/gourmetgo-${svc}:.*|image: ${USER}/gourmetgo-${svc}:${TAG}|" \
              docker-compose.prod.yml
          done
          echo "--- Updated docker-compose.prod.yml ---"
          grep "image:" docker-compose.prod.yml

      - name: Commit and push
        env:
          TAG: ${{ needs.generate-tag.outputs.image-tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docker-compose.prod.yml
          git diff --staged --quiet && echo "Nothing to commit." && exit 0
          git commit -m "ci: pin production images → ${TAG} [skip ci]"
          git push
