spring:
  application:
    name: kitchen-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/kitchen_db
    username: ${DB_USER:gourmetgo}
    password: ${DB_PASS:secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:8081}

grpc:
  server:
    port: ${GRPC_PORT:50052}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
