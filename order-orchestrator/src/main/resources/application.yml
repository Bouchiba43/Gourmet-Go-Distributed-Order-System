spring:
  application:
    name: order-orchestrator

server:
  port: ${SERVER_PORT:8083}

grpc:
  client:
    order-service:
      address: static://${ORDER_SERVICE_HOST:localhost}:50051
      negotiation-type: plaintext
    kitchen-service:
      address: static://${KITCHEN_SERVICE_HOST:localhost}:50052
      negotiation-type: plaintext
    accounting-service:
      address: static://${ACCOUNTING_SERVICE_HOST:localhost}:50053
      negotiation-type: plaintext

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
