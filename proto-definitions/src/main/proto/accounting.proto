syntax = "proto3";

package com.gourmetgo.accounting;

option java_package = "com.gourmetgo.proto.accounting";
option java_outer_classname = "AccountingProto";
option java_multiple_files = true;

// ── Messages ─────────────────────────────────────────────────────────────────

message AuthorizePaymentRequest {
  string order_id          = 1;
  string customer_id       = 2;
  double amount            = 3;
  string payment_method_id = 4;
}

message ConfirmPaymentRequest {
  string authorization_id = 1;
}

message ReversePaymentRequest {
  string authorization_id = 1;
  string reason           = 2;
}

message PaymentResponse {
  string        authorization_id = 1;
  PaymentStatus status           = 2;
  string        message          = 3;
}

enum PaymentStatus {
  PENDING    = 0;
  AUTHORIZED = 1;
  CONFIRMED  = 2;
  REVERSED   = 3;
  FAILED     = 4;
}

// ── Service ───────────────────────────────────────────────────────────────────

service AccountingService {
  rpc AuthorizePayment (AuthorizePaymentRequest) returns (PaymentResponse);
  rpc ConfirmPayment   (ConfirmPaymentRequest)   returns (PaymentResponse);
  rpc ReversePayment   (ReversePaymentRequest)   returns (PaymentResponse);
}
