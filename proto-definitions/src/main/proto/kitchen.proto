syntax = "proto3";

package com.gourmetgo.kitchen;

option java_package = "com.gourmetgo.proto.kitchen";
option java_outer_classname = "KitchenProto";
option java_multiple_files = true;

// ── Messages ─────────────────────────────────────────────────────────────────

message TicketItem {
  string menu_item_id          = 1;
  int32  quantity              = 2;
  string special_instructions  = 3;
}

message CreateTicketRequest {
  string            order_id = 1;
  repeated TicketItem items  = 2;
}

message GetTicketRequest {
  string ticket_id = 1;
}

message ConfirmTicketRequest {
  string ticket_id = 1;
}

message CancelTicketRequest {
  string ticket_id = 1;
  string reason    = 2;
}

message TicketResponse {
  string       ticket_id = 1;
  string       order_id  = 2;
  TicketStatus status    = 3;
}

enum TicketStatus {
  AWAITING_ACCEPTANCE = 0;
  ACCEPTED            = 1;
  PREPARING           = 2;
  READY_FOR_PICKUP    = 3;
  PICKED_UP           = 4;
  CANCELLED           = 5;
}

// ── Service ───────────────────────────────────────────────────────────────────

service KitchenService {
  rpc CreateTicket  (CreateTicketRequest)  returns (TicketResponse);
  rpc GetTicket     (GetTicketRequest)     returns (TicketResponse);
  rpc ConfirmTicket (ConfirmTicketRequest) returns (TicketResponse);
  rpc CancelTicket  (CancelTicketRequest)  returns (TicketResponse);
}
